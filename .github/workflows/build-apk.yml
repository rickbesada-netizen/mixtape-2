name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mixtape-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Smaller, minified build. Kept separate so a shrinker issue never blocks the debug APK.
      - name: Build release APK
        id: release
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mixtape-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Publish the APK on the repo's Releases page so it can be downloaded directly on a phone.
      - name: Prepare download files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Mixtape.apk
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk dist/Mixtape-small.apk
          fi

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mixtape (latest build)
          body: |
            Built from commit ${{ github.sha }}.
            Install Mixtape.apk. Mixtape-small.apk is a smaller optimised build.
          prerelease: false
          make_latest: true
          files: dist/*.apk
